<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-MG26ZXXB');</script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상 실습 쇼핑몰</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .product-list { display: flex; gap: 20px; flex-wrap: wrap; }
        .product-card { border: 1px solid #ddd; background: white; padding: 15px; border-radius: 8px; width: 200px; text-align: center; }
        .product-card button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .product-card button:hover { background-color: #0056b3; }
        #cart-section { margin-top: 30px; padding: 15px; background: white; border: 1px solid #ccc; border-radius: 8px; }
        #cart-items { list-style: none; padding: 0; }
        #cart-items li { padding: 5px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MG26ZXXB"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <header>
        <h1>🛒 GA4 실습용 가상 쇼핑몰</h1>
        <p>상품을 장바구니에 담고 이벤트를 측정해보세요!</p>
    </header>

    <main>
        <h2>추천 상품 목록</h2>
        <div class="product-list">
            <div class="product-card">
                <h3>무선 마우스</h3>
                <p>가격: 25,000원</p>
                <button class="add-to-cart" data-name="무선 마우스" data-price="25000">장바구니 담기</button>
            </div>
            <div class="product-card">
                <h3>기계식 키보드</h3>
                <p>가격: 89,000원</p>
                <button class="add-to-cart" data-name="기계식 키보드" data-price="89000">장바구니 담기</button>
            </div>
            <div class="product-card">
                <h3>27인치 모니터</h3>
                <p>가격: 199,000원</p>
                <button class="add-to-cart" data-name="27인치 모니터" data-price="199000">장바구니 담기</button>
            </div>
        </div>

        <section id="cart-section">
            <h2>🛒 내 장바구니 목록 (<span id="cart-count">0</span>개)</h2>
            <ul id="cart-items">
                <li>장바구니가 비어 있습니다.</li>
            </ul>
        </section>
    </main>

    <script>
        let cart = [];
        const buttons = document.querySelectorAll('.add-to-cart');
        const cartItemsList = document.getElementById('cart-items');
        const cartCount = document.getElementById('cart-count');

        buttons.forEach(button => {
            button.addEventListener('click', function() {
                const name = this.getAttribute('data-name');
                const price = this.getAttribute('data-price');
                
                cart.push({ name, price });
                updateCartUI();
            });
        });

        function updateCartUI() {
            cartCount.textContent = cart.length;
            cartItemsList.innerHTML = '';
            
            cart.forEach((item, index) => {
                const li = document.createElement('li');
                li.textContent = `${index + 1}. ${item.name} - ${parseInt(item.price).toLocaleString()}원`;
                cartItemsList.appendChild(li);
            });
        }
    </script>
</body>
</html>
