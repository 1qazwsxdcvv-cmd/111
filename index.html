<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가상 쇼핑몰 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f9f9f9; }
        .product { background: white; display: inline-block; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background-color: #ff4757; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; }
        button:hover { background-color: #ff6b81; }
    </style>
</head>
<body>

    <div class="product">
        <h2>🔥 특가 상품: 무선 블루투스 이어폰</h2>
        <p>가격: 59,000원</p>
        <button id="buyButton">장바구니 담기 / 구매하기</button>
    </div>

</body>
</html>
